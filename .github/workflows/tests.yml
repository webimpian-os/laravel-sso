name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '^10.0' }
          - { php: '8.2', laravel: '^11.0' }
          - { php: '8.3', laravel: '^12.0' }
          - { php: '8.4', laravel: '^13.0' }

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          # Older Laravel majors carry advisories Composer refuses by default; nothing here is deployed.
          composer config --no-plugins policy.advisories.block false
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - run: vendor/bin/pest
